# dsh-mcp-manager profile bundle layer.
#
# Mounts the MCP manager host plugin: a persisted registry of MCP servers that
# are mounted through the in-box bridge (@deepseek-ai/dsh-mcp-client), a
# same-origin RPC channel (/mcp-manager) for the native Desktop page contributed
# by lib/client.js, discovery of host-configured MCP rows, and connectivity
# tests. Servers are profile-wide: every session shares the same registry.
- insert:
    - id: mcp-manager
      name: dsh-mcp-manager
      config:
        manifestFile: ""
        autoMount: true
        defaultToolCallTimeoutMs: 60000
        probeTimeoutMs: 60000
